name: Weekly data refresh

# Pulls real arXiv + OpenAlex data, runs the full analysis, and commits an updated
# data/snapshot.json. The deployed Streamlit app reads that snapshot, so this is
# what keeps the live dashboard on fresh, real data. Runs weekly + on demand.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
    # Tuesday catch-up: self-heals a missed Monday (runner failure, timeout, GitHub
    # scheduler drought). A freshness guard below makes this a no-op whenever the
    # Monday run succeeded, so it costs nothing in normal weeks.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      max_per_period:
        description: "Max papers per arXiv category per quarter"
        default: "150"
      openalex_max:
        description: "Max papers to enrich via OpenAlex (citations/affiliations)"
        default: "500"

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # arXiv throttling is bursty: ingestion normally takes ~25 min but has taken 80+ on a
    # bad night (2026-07-02 run was killed by a 90-min cap while still ingesting). The cap
    # is a runaway guard, not a target — size it for the bad nights.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Freshness guard (Tuesday catch-up is a no-op when Monday succeeded)
        id: guard
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            age=$(python3 -c "import json,datetime;d=json.load(open('data/snapshot.json'))['meta']['refreshed_at'];print((datetime.date.today()-datetime.date.fromisoformat(d)).days)" 2>/dev/null || echo 999)
            if [ "$age" -lt 3 ]; then skip=true; fi
            echo "Snapshot age: ${age} day(s) -> skip=${skip}"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-full.txt

      - name: Refresh snapshot (real arXiv + OpenAlex)
        if: steps.guard.outputs.skip != 'true'
        env:
          SIGNAL_LAG_MAX_PER_PERIOD: ${{ github.event.inputs.max_per_period || '150' }}
          SIGNAL_LAG_OPENALEX_MAX: ${{ github.event.inputs.openalex_max || '500' }}
          # Optional: add a free key as repo secret SEMANTIC_SCHOLAR_API_KEY for
          # reliable Semantic Scholar enrichment (the keyless pool is rate-limited).
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          # Optional: add repo secret ANTHROPIC_API_KEY to enable the weekly Claude
          # analysis layer (genuine analytical narrative baked into the snapshot).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/refresh_snapshot.py --fresh

      - name: Commit updated snapshot
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          [ -f data/snapshot_prev.json ] && git add data/snapshot_prev.json || true
          [ -f data/history.json ] && git add data/history.json || true
          [ -f data/risk_register.json ] && git add data/risk_register.json || true
          [ -f data/verify_cache.json ] && git add data/verify_cache.json || true
          [ -f data/benchmark_history.json ] && git add data/benchmark_history.json || true
          [ -f data/citation_history.json ] && git add data/citation_history.json || true
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: weekly data refresh $(date -u +%Y-%m-%d)"
            # Rebase onto anything pushed since this run checked out (docs, another data
            # commit). -X theirs favors THIS run's freshly generated data files when both
            # sides touched them — a bare rebase conflicts on the big snapshot JSON and a
            # swallowed failure once left the repo mid-rebase and killed the push.
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" || {
              echo "rebase failed; aborting cleanly"; git rebase --abort || true; exit 1;
            }
            git push
            # Mirror the snapshot to the dev branch too (fast-forward only, so it's
            # skipped harmlessly if that branch has diverged). Keeps the live app
            # current whether it deploys from main or the feature branch.
            git push origin "HEAD:claude/ai-safety-foresight-analysis-fletm1" || \
              echo "feature branch not fast-forwardable; skipped"
          fi
